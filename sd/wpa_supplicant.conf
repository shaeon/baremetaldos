# wpa_supplicant.conf - the WiFi network BM-DOS joins (boot.conf network = wifi)
#
# Put your network's name and password below, keeping the quotes, and set the
# two-letter code of your country (it decides which channels may be used).
# The format is wpa_supplicant's own; Circle reads it from the card's root.
#
# Red WiFi de BM-DOS: pon abajo el nombre de tu red y su contraseña, con las
# comillas, y el código de tu país (decide qué canales se pueden usar).

country=ES

network={
	ssid="NombreDeTuRed"
	psk="TuContraseña"
	proto=WPA2
	key_mgmt=WPA-PSK
}
