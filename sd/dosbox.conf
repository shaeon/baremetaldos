# dosbox.conf - BM-DOS
#
# This is a DOSBox configuration file, not a Circle one: the emulator reads it
# with its own parser, so the syntax is the one documented at
# https://www.dosbox.com/wiki/dosbox.conf
#
# It lives on the first FAT32 partition of the SD card at
#   /dosbox/dosbox.conf
# and the kernel passes it to the core as the "content to load".  When DOSBox
# is given a .conf it boots straight into its own shell and runs whatever the
# [autoexec] section says, which is how the drives below get mounted.
#
# Keep [mixer] rate= in sync with MixerRate in src/kernel.cpp (currently 44100).
# A mismatch is audible as a pitch shift.

[sdl]
# These are accepted but ignored by the bare metal port (there is no SDL and no
# window).  Kept so that the same file works if you ever run DOSBox-core on a
# desktop for comparison.
fullscreen=false
output=surface

[dosbox]
# 16 MB is the classic sweet spot: enough for most 386/486 era games and XMS.
memsize=16

[cpu]
# Milestone 1 runs the portable interpreter, so this is the knob that decides
# whether a game is playable.  Too high and the emulated machine runs faster
# than the host can keep up (audio stutters); too low and DOS-era games refuse
# to start or feel wrong.
#
# Where the numbers come from.  A "cycle" is one emulated instruction per
# millisecond, and the reference points that matter for DOSBox are the ones in
# its own documentation and default configurations:
#
#   286 @ 12 MHz        1510     386DX @ 33 MHz (Pi 2/3 default)   6075
#   486DX @ 33 MHz      12010    486DX2 @ 66 MHz (Pi 4 default)  23880
#   486DX4 @ 100 MHz    33445    Pentium @ 75 MHz                 40072
#   Pentium @ 100 MHz   53430    Pentium @ 120 MHz (Pi 5 default) 64180
#
# This port asks for 24000, and does it from code, not from here: the five
# "cpu_cycles*" libretro options are answered by the frontend
# (src/platform/bare_coreopts.h, checked by `make check-coreopts`), and
# dosbox-core recomputes the cpu/cycles variable from those options during
# startup.  A line here alone does NOT work - it is read, and then overwritten
# from the core's own option table, which without the frontend's answer means
# DOSBox's 386DX-class default (10000).  That is what this port ran at until
# .58, whatever the line below said.
#
# The line stays for three reasons: it documents the figure on the card, it is
# the value DOSBox uses if the frontend answer is ever removed, and
# `config -set cycles=...` from the DOS prompt still works, because the core
# treats a change made *after* startup as authoritative and locks its option to
# it.  So this is a default, not the truth; the truth is bare_coreopts.h.
#
# 24000 rather than 23880 because the core option grid cannot express the odd
# eight: 2 x 10000 + 4 x 1000 = 24000, which is 0.5 % above the 486DX2-66
# reference.  Ctrl+F11 / Ctrl+F12 still move it in steps of the two values
# below, from this starting point.
# core=dynamic  -> the recompiler (JIT), built since .63 and ON by default in
#                  the Makefile.  In a real-mode game (Epic Pinball, Prince)
#                  this is the fast path: the interpreter cannot hold 70 Hz at
#                  30000 cycles, and the JIT can.
# core=auto     -> the JIT only once the game switches to protected mode, the
#                  interpreter before that.  The conservative choice: if a game
#                  misbehaves with core=dynamic, try this, and if that still
#                  misbehaves, core=normal.
core=dynamic
cputype=auto
cycles=fixed 24000

# Ctrl+F11 / Ctrl+F12 move the cycle count.  With "fixed", cycleup/cycledown are
# absolute amounts, not percentages.  The defaults (10 and 20) are DOSBox's and
# are far too slow to be useful here: going from 24000 to 40000 with steps of 10
# is four hundred keystrokes.  These two are sized for the range above: one
# press is roughly one machine generation.  24000 + 2000 is a 486DX4-class
# machine, 24000 - 2000 is a fast 486DX-33.
cycleup=2000
cycledown=2000

[mixer]
rate=44100
nosound=false

[sblaster]
# Sound Blaster is what almost every DOS game supports, and it is cheap to
# emulate.  sbtype=sb16 covers SB1/SB2/SBPro programs too.
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true

[gus]
# Gravis Ultrasound.  On by default; costs a little CPU - set gus=false if you
# do not need it.  Its music in most games needs the ULTRASND patches in
# C:\ULTRASND (from Gravis's disks); games that upload their own sounds do not.
gus=true

[speaker]
pcspeaker=true

[midi]
# MT-32 and General MIDI are rendered on core 1 when the kernel was built
# with scripts/build-midi-libs.sh (see README.md, "MIDI").  OPL music through
# the Sound Blaster works either way.
#
#   mididevice=mt32        Munt.  Needs MT32_CONTROL.ROM + MT32_PCM.ROM (or the
#                          CM32L_* pair) in /dosbox/system/.
#                          midiconfig=cm32l prefers the CM-32L pair.
#   mididevice=fluidsynth  General MIDI.  midiconfig = path of the .sf2;
#                          default /dosbox/system/default.sf2
#
# Games also need mpu401=intelligent to see the MPU-401.
# On by default: General MIDI through FluidSynth and an intelligent MPU-401.
# Without a SoundFont on the card FluidSynth says so in one line and the games
# keep their OPL music.
mididevice=fluidsynth
midiconfig=
mpu401=intelligent

[joystick]
joysticktype=none
# The USB gamepad layer is not wired up yet; the mouse and keyboard are.

[serial]
serial1=dummy
serial2=dummy

[autoexec]
# ---------------------------------------------------------------------------
# Mount the SD card as C: and boot.
# ---------------------------------------------------------------------------
# The port mounts the first FAT32 partition with FatFs, so DOSBox sees the card
# as its host file system.  "/dos" on the card is where you put games, one
# directory each:  /dos/DOOM/DOOM.EXE, /dos/TYRIAN/TYRIAN.EXE ...
MOUNT C /dos -freesize 1024
C:
# Uncomment to boot straight into a game instead of the C: prompt:
#cd DOOM
#DOOM.EXE

# CD images: DOSBox mounts an ISO/CUE itself, no host CD-ROM needed.  Put the
# image on the card and use IMGMOUNT:
#IMGMOUNT D /dos/ISO/MYGAME.ISO -t iso
#D:

# Keyboard layout: DOSBox's internal layouts ("es", "us", "de"...).  The USB
# scancodes are physical positions, so this changes what the keys produce, not
# how they are read.  See README.md, "Configuration".
KEYB es 850
