# boot.conf - BM-DOS
#
# The port's own settings, as opposed to DOSBox's.  It lives on the first FAT32
# partition of the card, as /boot.conf, and it is read by the kernel itself
# before anything else is set up.
#
# Why it is not in dosbox.conf: dosbox.conf is parsed by DOSBox, which starts
# after the display exists.  A display mode has to be chosen *before* the frame
# buffer is created, so it cannot live there.  The two files are read at
# different times by different programs; that is all there is to it.
#
# Format: one "key = value" per line, '#' starts a comment, anything unknown is
# ignored.  A missing file is not an error - every value below is the default.
# A file that cannot be parsed cannot make the board fail to boot, on purpose.

# ---------------------------------------------------------------------------
# display = WIDTHxHEIGHT
# ---------------------------------------------------------------------------
# The frame buffer the emulator draws into.  Everything DOSBox produces is
# converted and copied here, so the per-frame cost is proportional to this, not
# to the size of the emulated screen.
#
# At 1920x1080 that copy is 2.07 M pixels per frame = 124 MB/s at 60 Hz.
# At 1280x720 it is 0.92 M pixels = 55 MB/s.  On a Pi 4 running the interpreter,
# that difference is worth real frames per second.
#
#   1920x1080   what a 1080p panel does natively; the most pixels to copy
#   1280x720    default: exact 1.5x on a 1080p panel, 55 MB/s at 60 Hz
#   1024x768    for 4:3 monitors and VGA-era games
#    800x600    for a Pi 3, or if 720p still is not enough
#    640x480    VGA exactly, one output pixel per emulated pixel, no scaler
#
# If the mode is refused the next one down is tried automatically, so an
# unsupported value here cannot leave you with a black screen.
display = 1280x720

# ---------------------------------------------------------------------------
# boot_log = auto | quiet | off
# ---------------------------------------------------------------------------
# How much of the boot writes to the screen once the port owns it.
#
#   auto    everything: the version block, this port's progress, and every
#           line the emulation core logs.  This is the default, and the one to
#           use while something is being worked out.
#   quiet   the version block, this port's progress, and NOTHING from the core.
#           The core logs about forty lines while it reads dosbox.conf
#           ("Variable dosbox::machine updated to ..."), which is a screenful
#           that proves a file was read and is worth nothing the second time.
#   off     nothing at all: no version block, no progress, no core log.  The
#           first thing on screen is the picture.  For a finished card.
#
# In all three cases the log itself is untouched: every message still goes to
# Circle's log (tty1) and to the serial port.  This only decides what is painted.
boot_log = auto

# ---------------------------------------------------------------------------
# cpu_max_mhz = N
# ---------------------------------------------------------------------------
# The ceiling the clock governor is allowed to use, in MHz.  The governor has
# three levels of its own (600 at the DOS prompt, 1500 for DOSBox's default
# cycles, 2000 only when the frames do not fit); this caps the top of that
# range.  Set it to 1500 on a Pi in a small case, or leave it at 0 to let the
# firmware decide what the board can do.
#
# It is a ceiling, not a fixed speed: the governor still goes down to 600 when
# there is nothing to run.
cpu_max_mhz = 0

# ---------------------------------------------------------------------------
# video_core = 2 | 0
# ---------------------------------------------------------------------------
# Which core puts the picture on the screen while the emulator runs.
#
#   2   default.  Core 2 scales each frame into a hidden page, flips to it
#       and (vsync = on) waits for vertical sync.  Core 0 only hands the frame
#       over, so the emulator gets the time the scaling used to take - most
#       noticeable on a Pi 3 - and the picture does not tear.
#   0   core 0 scales straight into the page on screen, as before.  For
#       comparing the two, or if core 2 misbehaves on a board.
#
# If core 2 is not available the port falls back to 0 by itself.  The panel
# (PrtSc) shows "v2 ..." instead of "4 cores" while core 2 presents: frames
# flipped per second, frames replaced before core 2 took them, the worst
# scaling time, and "vs" while vsync is in force ("1p": one page only).
video_core = 2

# ---------------------------------------------------------------------------
# vsync = on | off
# ---------------------------------------------------------------------------
# With video_core = 2: wait for vertical sync after each flip.  On, the
# picture never tears; a DOS mode at 70 Hz on a 60 Hz display then drops
# about one frame in seven.  Off, frames are flipped as soon as they are ready.
# The speed of the emulated machine does not depend on this either way: it
# keeps its own clock.
vsync = on

# ---------------------------------------------------------------------------
# scaler = sharp | smooth
# ---------------------------------------------------------------------------
# How the picture is enlarged when the scale is not a whole number (640x400
# to 960x720 is x1.5 across and x1.8 down).
#
#   sharp    default.  Each screen row is the source row under it; only the
#            rows that fall on the boundary between two source rows mix them,
#            in proportion.  Text keeps its edges.
#   smooth   every row is interpolated from the two nearest: softer, the
#            port's original look.
#
# For a picture with no scaling at all, see display = 640x480 above.  The
# firmware can scale too: if the HDMI mode (hdmi_mode in config.txt) is not
# the same size as display, the GPU stretches the whole frame buffer with a
# smoothing filter - see README, "Sharp picture".
scaler = sharp

# ---------------------------------------------------------------------------
# audio_out = hdmi | jack      volume = 0..100      midi_volume = 25..200
# ---------------------------------------------------------------------------
# Where the sound goes (the other output is tried if this one does not start),
# the volume of everything, and the MIDI music against the rest of DOSBox's
# sound, in percent.  The setup menu (Win+F12, Sonido) changes all three.
audio_out = hdmi
volume = 100
midi_volume = 100

# ---------------------------------------------------------------------------
# mouse_speed = 25..400
# ---------------------------------------------------------------------------
# How far the DOS pointer moves for each movement of the USB mouse, in
# percent.  The setup menu (Win+F12, Entrada) changes it at once.
mouse_speed = 100

# ---------------------------------------------------------------------------
# setup_wait = 0..5
# ---------------------------------------------------------------------------
# Seconds the boot waits for SUPR or F2, which open the setup menu before
# DOSBox starts (like a PC's BIOS).  0 = no wait; Win+F12 opens the menu at
# any time later anyway.
setup_wait = 2

# ---------------------------------------------------------------------------
# network = off | ethernet | wifi      hostname      ip / gateway / dns
# ---------------------------------------------------------------------------
# The board's own network.  wifi (default) joins the network in
# wpa_supplicant.conf (card root) with the chip's firmware in /firmware; the
# setup menu (Win+F12, Red, Elegir red WiFi) lists the networks around and
# writes that file.  off: no network at all, for whoever does not want it.
# Until a real network is configured the boot does not wait for the time.  The boot does not wait for it: DHCP or the WiFi
# association finish while DOS already runs; the setup menu (Win+F12, Red)
# shows how far it got.
#
#   ip = dhcp                  the router gives the address (default)
#   ip = 192.168.1.50/24       a fixed address, with the two below
#   gateway = 192.168.1.1
#   dns = 192.168.1.1
network = wifi
hostname = bmdos
ip = dhcp

# ---------------------------------------------------------------------------
# timezone = a POSIX TZ rule
# ---------------------------------------------------------------------------
# DOS's clock comes from the network (NTP) when network is on, in this zone.
# DOSBox reads it once, when DOS starts: without a network the board has no
# clock and DOS starts in 1970.  The setup menu (Win+F12, Red) offers the usual
# zones; any POSIX rule works here:
#   CET-1CEST,M3.5.0,M10.5.0/3     peninsular Spain, with summer time
#   WET0WEST,M3.5.0/1,M10.5.0      Canary Islands, Portugal
#   UTC0                           no zone
timezone = CET-1CEST,M3.5.0,M10.5.0/3

# Lo que NO se configura aqui, y por que:
#
#   ritmo de frames   lo anuncia el core y el port lo obedece. Ponerlo a mano
#                     seria pelearse con la emulacion: un modo de texto de DOS
#                     va a 70 Hz y marcarlo a 60 hace que la maquina corra un
#                     17 % mas lenta.
#   aspecto           lo decide el core (4:3 para todo lo que importa) y el
#                     escalado lo respeta. No hay nada que ajustar.
#   escalado          automatico: el mayor 4:3 que quepa, con pixeles cuadrados
#                     cuando el multiplo entero llena al menos el 85 %.
